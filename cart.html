<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart - ShopMate Pakistan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
    <div id="navbar"></div>

    <div class="container section-pad pb-3">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb breadcrumb-custom">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item active">Shopping Cart</li>
        </ol>
      </nav>
      <h1 class="section-title mb-0">Shopping Cart</h1>
    </div>

    <div class="container pb-5">
      <div id="cartContent"></div>
    </div>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/common.js"></script>
    <script>
      let discountApplied = 0;

      function renderCart() {
        const cart = getCart();
        const container = document.getElementById('cartContent');

        if (cart.length === 0) {
          container.innerHTML = `
            <div class="empty-state" data-aos="fade-up">
              <i class="bi bi-cart-x"></i>
              <h3>Your cart is empty</h3>
              <p class="text-muted-2 mb-4">Looks like you haven't added anything yet. Let's fix that!</p>
              <a href="shop.html" class="btn-brand">Start Shopping <i class="bi bi-arrow-right ms-1"></i></a>
            </div>`;
          return;
        }

        const subtotal = getCartTotal();
        const shipping = subtotal > 2000 ? 0 : 200;
        const total = subtotal + shipping - discountApplied;

        container.innerHTML = `
          <div class="row g-4">
            <div class="col-lg-8" data-aos="fade-up">
              ${cart.map((item, i) => {
                const p = PRODUCTS.find(x => x.id === item.id);
                if (!p) return '';
                return `
                  <div class="cart-item mb-3 d-flex align-items-center gap-3 flex-wrap">
                    <img src="${p.images[0]}" alt="${p.name}">
                    <div class="flex-grow-1">
                      <h6 class="fw-700 mb-1"><a href="product.html?id=${p.id}" class="text-decoration-none" style="color:var(--text)">${p.name}</a></h6>
                      <small class="text-muted-2">${item.options.color || ''} ${item.options.size || ''}</small>
                      <div class="text-brand fw-700 mt-1">${formatPKR(p.price)}</div>
                    </div>
                    <div class="qty-selector">
                      <button class="qty-btn" onclick="changeQty(${i}, -1)"><i class="bi bi-dash"></i></button>
                      <input type="text" class="qty-val" value="${item.qty}" readonly>
                      <button class="qty-btn" onclick="changeQty(${i}, 1)"><i class="bi bi-plus"></i></button>
                    </div>
                    <div class="fw-700 text-end" style="min-width:100px;">${formatPKR(p.price * item.qty)}</div>
                    <button class="icon-btn text-danger" onclick="removeItem(${i})" title="Remove"><i class="bi bi-trash3"></i></button>
                  </div>`;
              }).join('')}
              <div class="d-flex justify-content-between mt-3">
                <a href="shop.html" class="btn-outline-brand"><i class="bi bi-arrow-left me-1"></i> Continue Shopping</a>
                <button class="btn btn-sm text-brand" onclick="clearCart()">Clear Cart</button>
              </div>
            </div>
            <div class="col-lg-4" data-aos="fade-up" data-aos-delay="100">
              <div class="summary-card">
                <h5 class="fw-700 mb-3">Order Summary</h5>
                <div class="summary-row"><span>Subtotal</span><span>${formatPKR(subtotal)}</span></div>
                <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? 'FREE' : formatPKR(shipping)}</span></div>
                ${discountApplied > 0 ? `<div class="summary-row text-success"><span>Discount</span><span>-${formatPKR(discountApplied)}</span></div>` : ''}
                <div class="mb-3 mt-2">
                  <label class="form-label">Discount Code</label>
                  <div class="d-flex gap-2">
                    <input type="text" class="form-control" id="discountInput" placeholder="Enter code">
                    <button class="btn-brand" onclick="applyDiscount()">Apply</button>
                  </div>
                  <small class="text-muted-2">Try "SHOP10" for 10% off</small>
                </div>
                <div class="summary-total d-flex justify-content-between"><span>Total</span><span class="text-brand">${formatPKR(total)}</span></div>
                <a href="checkout.html" class="btn-brand w-100 mt-3"><i class="bi bi-credit-card me-1"></i> Proceed to Checkout</a>
                <div class="text-center mt-3">
                  <small class="text-muted-2"><i class="bi bi-shield-check text-success"></i> Secure checkout with SSL encryption</small>
                </div>
              </div>
            </div>
          </div>`;
        if (window.AOS) AOS.refresh();
      }

      function changeQty(idx, delta) {
        const cart = getCart();
        if (cart[idx]) {
          cart[idx].qty = Math.max(1, cart[idx].qty + delta);
          setCart(cart);
          renderCart();
        }
      }
      function removeItem(idx) {
        removeFromCart(idx);
        renderCart();
        showToast('Item removed from cart');
      }
      function clearCart() {
        setCart([]);
        renderCart();
        showToast('Cart cleared');
      }
      function applyDiscount() {
        const code = document.getElementById('discountInput').value.trim().toUpperCase();
        if (code === 'SHOP10') {
          discountApplied = Math.round(getCartTotal() * 0.1);
          showToast('10% discount applied!', 'success');
          renderCart();
        } else {
          showToast('Invalid discount code');
        }
      }

      initCommon('cart');
      renderCart();
    </script>
  </body>
</html>
